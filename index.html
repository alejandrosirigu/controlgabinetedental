.chair-map-hint{font-size:12px;color:var(--muted);margin-top:5px}

function activeModule(date=currentDate){
  const d=parseDate(date), dow=d.getDay();

}
function moduleSchedule(date=currentDate){
  const d=parseDate(date), dow=d.getDay();
  const ex=state.exceptions.find(x=>x.date===date);
  if(ex)return [{...ex,exception:true}];
  return state.modules.filter(m=>Number(m.day)===dow).sort((a,b)=>a.start.localeCompare(b.start));
}
function ensureGroups(mid){
  if(!mid)return;
  const arr=studentsForModule(mid);
  if(!state.groups[mid])state.groups[mid]=[];
  const existing=new Set(state.groups[mid].flat());
  arr.forEach(s=>{if(!existing.has(s.id))state.groups[mid].push([s.id])});
  // Normalize to chairs
  distributeModule(mid,false);
}
function distributeModule(mid,random=true){
  const arr=studentsForModule(mid);
  if(!arr.length){state.groups[mid]=Array.from({length:state.config.chairs},()=>[]);return}
  let list=[...arr];
  const mode=state._distribution?.[mid]||"balanced";
  if(random || mode==="random")list.sort(()=>Math.random()-.5);
  const groups=Array.from({length:state.config.chairs},()=>[]);
  list.forEach((s,i)=>groups[i%state.config.chairs].push(s.id));
  state.groups[mid]=groups;
  saveSilent();
}
function saveSilent(){localStorage.setItem(KEY,JSON.stringify(state))}
function normalizeChairConfig(){
  const count=Math.max(1,Number(state.config?.chairs)||6);
  let labels=Array.isArray(state.config.chairLabels)?state.config.chairLabels.slice(0,count):[];
  while(labels.length<count)labels.push(labels.length?Math.max(...labels.map(Number).filter(Number.isFinite),0)+1:labels.length+1);
  labels=labels.slice(0,count).map((n,i)=>{const v=Number(n);return Number.isFinite(v)&&v>0?Math.trunc(v):i+1});
  let order=Array.isArray(state.config.chairOrder)?state.config.chairOrder.filter(i=>Number.isInteger(i)&&i>=0&&i<count):[];
  const seen=new Set(order);
  for(let i=0;i<count;i++)if(!seen.has(i))order.push(i);
  state.config.chairLabels=labels;state.config.chairOrder=order.slice(0,count);
}
function chairLabel(i){normalizeChairConfig();return state.config.chairLabels[i]||i+1}

function evalKey(date,chair){return date+"|"+chair}
function sessionKey(date,mid){return date+"|"+(mid||"none")}

function getEval(date,chair){

}
function taskAppliesToModule(task,mid){
  if(task.moduleScope!=="specific")return true;
  return !!mid && (task.moduleIds||[]).includes(mid);
}
function taskModuleLabel(task){
  if(task.moduleScope!=="specific")return "Todos los módulos";
  const names=(task.moduleIds||[]).map(id=>state.modules.find(m=>m.id===id)?.name).filter(Boolean);
  return names.length?names.join(" · "):"Sin módulos seleccionados";
}
function taskAppliesToChair(task,index){
  if(task.scope!=="specific")return true;
  if(Array.isArray(task.chairIndexes))return task.chairIndexes.includes(index);
  return (task.chairs||[]).includes(index)|| (task.chairs||[]).includes(index+1);
}
function taskChairLabel(task){
  if(task.scope!=="specific")return "Todos los sillones";
  const indexes=Array.isArray(task.chairIndexes)?task.chairIndexes:(task.chairs||[]).map(n=>Number(n)-1);

function instrumentalTasksForModule(mid){return state.tasks.filter(t=>t.instrumental&&taskAppliesToModule(t,mid));}
function distributionToken(date,mode){
  const d=parseDate(date);
  if(mode==="session")return isoDate(d);
  if(mode==="month")return `${d.getFullYear()}-${d.getMonth()+1}`;

}

    saveSilent();
  }
}

function academicCourseBounds(date){
  const d=parseDate(date), year=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;
  return {start:new Date(year,8,1),end:new Date(year+1,7,31,23,59,59),label:`${year}/${String(year+1).slice(-2)}`};
}
function trimesterBounds(date,n){
  const course=academicCourseBounds(date);
  if(n===1)return {start:new Date(course.start),end:new Date(course.start.getFullYear(),11,31,23,59,59)};
  if(n===2)return {start:new Date(course.start.getFullYear()+1,0,1),end:new Date(course.start.getFullYear()+1,2,31,23,59,59)};
  return {start:new Date(course.start.getFullYear()+1,3,1),end:new Date(course.start.getFullYear()+1,5,30,23,59,59)};
}
function statsPeriodLabel(period){return ({day:"Día",month:"Mes",trimester1:"1r trimestre",trimester2:"2º trimestre",trimester3:"3r trimestre",course:"Curso completo"}[period]||"Mes");}
function getStatsRange(period){
  const today=parseDate(currentDate);
  if(period==="day")return {start:new Date(today),end:new Date(today.getFullYear(),today.getMonth(),today.getDate(),23,59,59)};
  if(period==="month")return {start:new Date(today.getFullYear(),today.getMonth(),1),end:new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59)};
  if(period==="course")return academicCourseBounds(currentDate);
  if(period==="trimester1"||period==="trimester2"||period==="trimester3")return trimesterBounds(currentDate,+period.slice(-1));
  return {start:new Date(today.getFullYear(),today.getMonth(),1),end:today};
}

  const labels=Array.from({length:count},(_,i)=>{const existing=inputs.find(x=>+x.dataset.index===i);return existing?+existing.value:(state.config.chairLabels[i]||i+1)});

function importStudents(ev,mid){
  const file=ev.target.files[0];if(!file)return;
  const isCsv=file.name.toLowerCase().endsWith(".csv");
  const reader=new FileReader();
  reader.onload=e=>{try{
    let rows=[];
    if(isCsv){
      rows=String(e.target.result||"").split(/\r?\n/).map(r=>r.split(",")).filter(r=>r.some(c=>String(c||"").trim()));
    }else{
      if(!window.XLSX)throw Error("No se ha cargado el lector Excel");
      const wb=XLSX.read(e.target.result,{type:"array"});
      rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    }
    const first=rows[0]||[];
    const header=first.map(x=>String(x||"").trim().toLowerCase());
    const hasHeader=header.some(x=>x.includes("nombre")||x.includes("apellido"));
    const nameCol=Math.max(0,header.findIndex(x=>x.includes("nombre")));
    const surnameCol=Math.max(0,header.findIndex(x=>x.includes("apellido")));
    const notesCol=Math.max(0,header.findIndex(x=>x.includes("observ")||x.includes("nota")));
    const startRow=hasHeader?1:0;
    const existing=new Set(state.students.filter(s=>s.moduleId===mid).map(s=>(`${s.name} ${s.surname||""}`).trim().toLowerCase()));
    let added=0;
    for(let i=startRow;i<rows.length;i++){
      const row=rows[i]||[];
      const name=String(row[hasHeader&&nameCol>=0?nameCol:0]||"").trim();
      const surname=String(row[hasHeader&&surnameCol>=0?surnameCol:1]||"").trim();
      const notes=String(row[hasHeader&&notesCol>=0?notesCol:2]||"").trim();
      const fullName=[name,surname].filter(Boolean).join(" ").trim();
      if(fullName&&!existing.has(fullName.toLowerCase())){state.students.push({id:uid("s"),name:fullName,surname,firstName:name,moduleId:mid,notes});existing.add(fullName.toLowerCase());added++;}
    }
    distributeModule(mid,false);save();refreshModal("groups");
    showToast(`${added} alumno${added===1?"":"s"} importado${added===1?"":"s"} en este módulo`);
  }catch(err){showToast("No se pudo leer el archivo")}};
  if(isCsv)reader.readAsText(file,"UTF-8");else reader.readAsArrayBuffer(file);
}

function toggleChairPicker(){
  document.getElementById("chairPickerField")?.classList.toggle("hidden",document.getElementById("taskScope")?.value!=="specific");
}
function toggleTaskModulePicker(prefix){
  const scope=document.getElementById(`${prefix}ModuleScope`)?.value;
  document.getElementById(`${prefix}ModulePicker`)?.classList.toggle("hidden",scope!=="specific");
}
function toggleChairPickerEdit(){
  document.getElementById("editChairPickerField")?.classList.toggle("hidden",document.getElementById("editTaskScope")?.value!=="specific");
}
function selectedChairs(){return [...document.querySelectorAll(".chairPick:checked")].map(x=>+x.value)}
function selectedEditChairs(){return [...document.querySelectorAll(".editChairPick:checked")].map(x=>+x.value)}
function selectedModuleIds(prefix){return [...document.querySelectorAll(`.modulePick-${prefix}:checked`)].map(x=>x.value)}
function addTask(){
  const name=document.getElementById("taskName").value.trim();
  if(!name)return showToast("Escribe una tarea");
  const scope=document.getElementById("taskScope").value;
  const chairs=scope==="specific"?selectedChairs():[];
  const chairIndexes=chairs;
  if(scope==="specific"&&!chairs.length)return showToast("Selecciona al menos un sillón");
  const moduleScope=document.getElementById("newTaskModuleScope").value;
  const moduleIds=moduleScope==="specific"?selectedModuleIds("newTask"):[];
  if(moduleScope==="specific"&&!moduleIds.length)return showToast("Selecciona al menos un módulo");
  state.tasks.push({id:uid("t"),section:document.getElementById("taskSection").value,name,frequency:document.getElementById("taskFreq").value,scope,chairs,chairIndexes,moduleScope,moduleIds,instrumental:!!document.getElementById("taskInstrumental")?.checked});
  save();refreshModal("tasks");
}
function editTask(id){openModal("taskEdit",id)}
function saveTaskEdit(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const name=document.getElementById("editTaskName").value.trim();
  if(!name)return showToast("Escribe una tarea");
  const scope=document.getElementById("editTaskScope").value;
  const chairIndexes=scope==="specific"?selectedEditChairs():[];
  const chairs=chairIndexes.map(i=>i+1);
  if(scope==="specific"&&!chairIndexes.length)return showToast("Selecciona al menos un sillón");
  const moduleScope=document.getElementById("editTaskModuleScope").value;
  const moduleIds=moduleScope==="specific"?selectedModuleIds("editTask"):[];
  if(moduleScope==="specific"&&!moduleIds.length)return showToast("Selecciona al menos un módulo");
  t.name=name;t.section=document.getElementById("editTaskSection").value.trim()||t.section;t.frequency=document.getElementById("editTaskFreq").value;t.scope=scope;t.chairs=chairs;t.chairIndexes=chairIndexes;t.moduleScope=moduleScope;t.moduleIds=moduleIds;t.instrumental=!!document.getElementById("editTaskInstrumental")?.checked;
  save();refreshModal("tasks");
}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);save();refreshModal("tasks")}
function setTaskEval(chair,tid,val){getEval(currentDate,chair).tasks[tid]=val;saveSilent()}
function setRating(chair,key,val){getEval(currentDate,chair)[key]=val;saveSilent();refreshModal("chair",chair)}
function setNotes(chair,val){getEval(currentDate,chair).notes=val;saveSilent()}
function exportData(){saveSilent();const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="control-gabinete-dental-copia.json";a.click();URL.revokeObjectURL(a.href);showToast("Copia descargada")}
function importData(ev){const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.config||!x.modules)throw Error();Object.assign(state,x);save();closeModal();renderApp();showToast("Copia cargada correctamente")}catch(e){showToast("El archivo no parece una copia válida")}};r.readAsText(file)}
function resetAll(){if(!confirm("¿Seguro que quieres borrar todos los datos? Esta acción no se puede deshacer sin una copia de seguridad."))return;localStorage.removeItem(KEY);location.reload()}
load();document.body.classList.toggle("theme-cute",state.config.theme==="cute");const initialMeta=document.querySelector('meta[name="theme-color"]');if(initialMeta)initialMeta.content=state.config.theme==="cute"?"#dcefdc":"#173f3f";render();
</script>
</body>
