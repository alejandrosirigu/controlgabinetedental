button,input,select,textarea{font:inherit}

.chair.active{border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,90,88,.09)}
.chair-number{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.chair-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--mint);color:var(--teal);padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.side-card{padding:20px}
.side-card h3{font:700 20px Georgia,serif;color:var(--teal);margin:0 0 15px}
.timeline{display:flex;flex-direction:column;gap:9px}
.timeline-item{padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--paper2)}
.timeline-item.current{border-color:#a9c8c1;background:#edf6f2}
.timeline-item b{font-size:13px}.timeline-item small{display:block;color:var(--muted);margin-top:3px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--teal)}

.modal-body{padding:23px}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:0;background:var(--paper2);color:var(--muted);padding:9px 13px;border-radius:12px;font-weight:700}
.tab.active{background:var(--teal);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}

.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{border:1px solid var(--line);background:#fffefa;color:var(--ink);border-radius:12px;padding:11px 12px;outline:none}

.student-layout .student-box{min-height:150px}
.drag-zone{border:1px dashed transparent;border-radius:12px;padding:4px;transition:.15s}

.drag-zone{min-height:80px}

.check-row:last-child{border-bottom:0}
.check-row input{width:18px;height:18px}
.stars{display:flex;gap:3px}.star{border:0;background:transparent;font-size:26px;padding:0;color:#c8c0b2}.star.on{color:var(--gold)}
.rating-box{background:#faf5e8;border:1px solid #ead8b5;border-radius:17px;padding:14px}
.stats-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--paper2)}.stat strong{font-size:26px;color:var(--teal);display:block}.stat small{color:var(--muted)}

.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--teal);color:white;padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:100;animation:up .2s ease}
@keyframes up{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.chair.dragging{opacity:.45;transform:scale(.98)}

.instrumental-title{padding:11px 13px;font-weight:900;color:#806427;background:#fff6dd}

.chair-map-hint{font-size:12px;color:var(--muted);margin-top:5px}

footer{text-align:center;padding:18px;color:var(--muted);font-size:12px}

function shuffleIds(ids){
  const a=[...ids];

function cleanGroups(groups,mid,date=currentDate){
  const allowed=new Set(presentStudentsForSession(mid,date).map(s=>s.id));
  const seen=new Set();
  const out=Array.from({length:state.config.chairs},()=>[]);
  (Array.isArray(groups)?groups:[]).slice(0,state.config.chairs).forEach((group,i)=>{
    (Array.isArray(group)?group:[]).forEach(sid=>{
      if(allowed.has(sid)&&!seen.has(sid)){out[i].push(sid);seen.add(sid);}

  });

}

function ensureSessionGroups(mid,date=currentDate){
  if(!mid)return Array.from({length:state.config.chairs},()=>[]);
  const key=sessionGroupKey(date,mid);
  const mode=distributionMode(mid);
  const active=presentStudentsForSession(mid,date);
  const signature=sessionAttendanceSignature(mid,date);
  const meta=state.sessionMeta[key]||{};
  let groups=state.sessionGroups[key];

  if(mode==="session"){
    if(!Array.isArray(groups)||meta.distributionMode!=="session"||meta.attendanceSignature!==signature){
      groups=groupsFromIds(active.map(s=>s.id),true);
      state.sessionGroups[key]=groups;
      state.sessionMeta[key]={...(state.sessionMeta[key]||{}),distributionMode:"session",attendanceSignature:signature};
      saveSilent();
    }
  }else if(mode==="month"||mode==="quarter"){
    const order=periodGroupOrder(mid,date,mode);
    groups=groupsFromIds(order.filter(id=>active.some(s=>s.id===id)),false);
    state.sessionGroups[key]=groups;
    state.sessionMeta[key]={...(state.sessionMeta[key]||{}),distributionMode:mode,attendanceSignature:signature};

function syncAllSessionGroupsForStudent(mid,sid){

function distributeModule(mid,random=false,date=currentDate){
  if(!mid)return;
  const mode=distributionMode(mid);
  const active=presentStudentsForSession(mid,date);
  const key=sessionGroupKey(date,mid);
  let groups;

  if(mode==="month"||mode==="quarter"){
    const order=periodGroupOrder(mid,date,mode);
    groups=groupsFromIds(order.filter(id=>active.some(s=>s.id===id)),false);
  }else{
    groups=groupsFromIds(active.map(s=>s.id),!!random);
  }

  state.sessionGroups[key]=groups;
  state.sessionMeta[key]={...(state.sessionMeta[key]||{}),distributionMode:mode,attendanceSignature:sessionAttendanceSignature(mid,date),lastDistributedAt:Date.now()};
  saveSilent();
  return groups;
}

function normalizeChairConfig(){
  const count=Math.max(1,Number(state.config?.chairs)||6);
  let labels=Array.isArray(state.config.chairLabels)?state.config.chairLabels.slice(0,count):[];
  while(labels.length<count)labels.push(labels.length?Math.max(...labels.map(Number).filter(Number.isFinite),0)+1:labels.length+1);
  labels=labels.slice(0,count).map((n,i)=>{const v=Number(n);return Number.isFinite(v)&&v>0?Math.trunc(v):i+1});

  const seen=new Set(order);
  for(let i=0;i<count;i++)if(!seen.has(i))order.push(i);
  state.config.chairLabels=labels;state.config.chairOrder=order.slice(0,count);
}

function closeModal(){document.getElementById("modal")?.remove();currentChair=null}
function modalShell(title,body){return `<div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div>`}
function modalHTML(type,extra){
  if(type==="chairs")return modalShell("🪑 Configurar sillones",`
    <div class="form-grid three">
      <div class="field"><label>Número de sillones</label><input id="chairCount" type="number" min="1" max="40" value="${state.config.chairs}"></div>
      <div class="field"><label>Filas</label><input id="chairRows" type="number" min="1" max="10" value="${state.config.rows}"></div>
      <div class="field"><label>Columnas</label><input id="chairCols" type="number" min="1" max="10" value="${state.config.cols}"></div>
    </div>
    <div class="rating-box" style="margin-top:14px"><b>🔢 Numeración real de los sillones</b><p style="margin:5px 0 12px;color:var(--muted);font-size:13px">Puedes cambiar manualmente el número visible de cada sillón. La identidad interna se conserva, por lo que sus alumnos, evaluaciones y tareas siguen vinculados al sillón correcto.</p>
      <div class="form-grid three">${Array.from({length:state.config.chairs},(_,i)=>`<div class="field"><label>Sillón ${i+1} · número visible</label><input class="chairLabelInput" data-index="${i}" type="number" min="1" max="999" value="${chairLabel(i)}"></div>`).join("")}</div>
    </div>
    <p style="color:var(--muted);font-size:13px;margin-top:15px">La cuadrícula se adapta automáticamente. Puedes <b>arrastrar los sillones directamente en el mapa</b> para cambiar su posición; las filas y columnas solo controlan la forma de la cuadrícula.</p>
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveChairs()">Guardar configuración</button></div>`);
  if(type==="modules")return modalShell("🗓️ Configurar módulos",`
    <div class="form-grid">
      <div class="field"><label>Nombre del módulo</label><input id="modName" placeholder="Ej. Taller Bucodental"></div>
      <div class="field"><label>Día</label><select id="modDay">${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"].map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></div>
      <div class="field"><label>Hora de inicio</label><input id="modStart" type="time" value="09:00"></div>
      <div class="field"><label>Hora de fin</label><input id="modEnd" type="time" value="11:00"></div>
    </div><div class="actions"><button class="btn btn-primary" onclick="addModule()">Añadir módulo</button></div>
    <div class="list">${state.modules.map(m=>`<div class="list-row"><div class="list-main"><b>${esc(m.name)}</b><small>${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][m.day]} · ${m.start}–${m.end}</small></div><button class="btn btn-danger btn-small" onclick="deleteModule('${m.id}')">Eliminar</button></div>`).join("")||`<div class="empty">Todavía no hay módulos.</div>`}</div>
    <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
    <h3 style="color:var(--teal)">Sesiones excepcionales</h3><p style="font-size:13px;color:var(--muted)">Permite indicar qué módulo se imparte un día concreto aunque no coincida con el horario habitual.</p>
    <div class="form-grid"><div class="field"><label>Fecha</label><input id="exDate" type="date" value="${currentDate}"></div><div class="field"><label>Módulo excepcional</label><select id="exModule">${state.modules.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></div></div>
    <div class="actions"><button class="btn btn-soft" onclick="addException()">Añadir excepción</button></div>
    <div class="list">${state.exceptions.map(x=>`<div class="list-row"><div class="list-main"><b>${fmtDate(x.date)}</b><small>${esc(x.name)} · sesión excepcional</small></div><button class="btn btn-danger btn-small" onclick="deleteException('${x.id}')">Eliminar</button></div>`).join("")}</div>`);
  if(type==="groups")return groupsModal();
  if(type==="tasks")return tasksModal();
  if(type==="calendar")return calendarModal();
  if(type==="backup")return backupModal();
  if(type==="stats")return statsModal();
  if(type==="taskEdit")return taskEditModal(extra);
  if(type==="studentEdit")return studentEditModal(extra);
  if(type==="chair")return chairModal(extra);
}
function groupsModal(){
  const mids=state.modules;
  const selected=window._groupModule||activeModule()?.id||mids[0]?.id||"";
  window._groupModule=selected;
  const allStudents=studentsForModule(selected);
  const present=presentStudentsForSession(selected,currentDate);
  const absent=allStudents.filter(s=>!isStudentPresent(currentDate,selected,s.id));
  const tab=window._groupTab||"students";
  const mode=distributionMode(selected);
  const groups=ensureSessionGroups(selected,currentDate);

  const modeLabel={
    manual:"Manual",
    balanced:"Equitativa",
    random:"Aleatoria esta sesión",
    session:"Aleatoria por sesión",
    month:"Aleatoria mensual",
    quarter:"Aleatoria trimestral"
  }[mode]||"Equitativa";

  const moduleTabs=mids.map(m=>`<button class="tab ${m.id===selected?"active":""}" onclick="window._groupModule='${m.id}';refreshModal('groups')">${esc(m.name)}</button>`).join("");

  const studentRows=allStudents.length?allStudents.map(s=>{
    const presentToday=isStudentPresent(currentDate,selected,s.id);
    const full=studentLabel(s)||s.name||"Alumno sin nombre";
    return `<div class="list-row ${presentToday?"":"student-absent"}">
      <div class="list-main" style="flex:1;min-width:0">
        <b>👤 ${esc(full)}</b>
        <small>${s.surname?`Apellidos: ${esc(s.surname)}`:""}${s.notes?`${s.surname?" · ":""}${esc(s.notes)}`:""}</small>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        <label class="attendance-toggle" title="${presentToday?"Marcar como ausente":"Marcar como presente"}">
          <input type="checkbox" ${presentToday?"checked":""} onchange="setStudentAttendance('${s.id}','${selected}',this.checked)">
          <span>${presentToday?"Presente":"No ha asistido"}</span>
        </label>
        <button class="btn btn-soft btn-small" onclick="editStudent('${s.id}','${selected}')">Editar</button>
        <button class="btn btn-danger btn-small" onclick="removeStudent('${s.id}','${selected}')">Eliminar</button>
      </div>
    </div>`;
  }).join(""):`<div class="empty">Todavía no hay alumnos en este módulo.</div>`;

  const groupBoxes=Array.from({length:state.config.chairs},(_,i)=>`
    <div class="student-box">
      <h4>🦷 Sillón ${chairLabel(i)} <span style="float:right;font-size:12px;color:var(--muted)">${(groups[i]||[]).length}</span></h4>
      <div class="drag-zone" data-session-drop-chair="${i}" ondragover="event.preventDefault()" ondrop="dropStudent(event,'${selected}',${i})">
        ${(groups[i]||[]).map(sid=>{
          const s=state.students.find(x=>x.id===sid);
          return s?`<div class="student-chip" draggable="true" ondragstart="dragStudent(event,'${selected}','${sid}')">
            <span>👤 ${esc(studentLabel(s))}</span>
            <button class="close" style="width:27px;height:27px;font-size:15px" onclick="removeFromCurrentSession('${selected}','${sid}')">×</button>
          </div>`:"";
        }).join("")||`<div style="color:var(--muted);font-size:12px;padding:8px 0">Arrastra aquí a los presentes.</div>`}
      </div>
    </div>`).join("");

  return modalShell("👥 Configurar grupos",`
    <div class="tabs">${moduleTabs}</div>
    <div class="rating-box" style="margin-bottom:13px">
      <b>📅 Sesión del ${fmtDate(currentDate)}</b>
      <p style="margin:5px 0 0;color:var(--muted);font-size:13px">
        <b>${present.length}</b> presentes · <b>${absent.length}</b> ausencias · distribución actual: <b>${esc(modeLabel)}</b>.
      </p>
    </div>

    <div class="tabs">
      <button class="tab ${tab==="students"?"active":""}" onclick="window._groupTab='students';refreshModal('groups')">👩‍🎓 Alumnado</button>
      <button class="tab ${tab==="distribution"?"active":""}" onclick="window._groupTab='distribution';refreshModal('groups')">🦷 Distribución de sillones</button>
    </div>

    ${tab==="students"?`
      <div class="form-grid">
        <div class="field"><label>Añadir alumno</label><input id="newStudent" placeholder="Nombre y apellidos"></div>
        <div class="field"><label>Sesión</label><input type="text" value="${fmtDate(currentDate)}" disabled></div>
      </div>
      <div class="actions">
        <button class="btn btn-soft" onclick="addStudent('${selected}')">+ Añadir alumno</button>
        <label class="btn btn-ghost">📄 Importar Excel/CSV<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="importStudents(event,'${selected}')"></label>
      </div>
      <p style="font-size:12px;color:var(--muted)">
        Puedes editar o eliminar alumnos, y marcar quién <b>no ha asistido hoy</b>. Las ausencias no se incluyen al distribuir los sillones.
        La importación reconoce <b>Nombre + Apellidos</b>, “Nombre y apellidos”, “Alumno/Estudiante” y archivos sin cabecera.
      </p>
      <div class="list">${studentRows}</div>
    `:`
      <div class="form-grid">
        <div class="field">
          <label>Modo de distribución</label>
          <select id="distMode">
            <option value="manual" ${mode==="manual"?"selected":""}>✋ Manual (arrastrando)</option>
            <option value="balanced" ${mode==="balanced"?"selected":""}>⚖️ Equitativa</option>
            <option value="random" ${mode==="random"?"selected":""}>🔀 Aleatoria esta sesión</option>
            <option value="session" ${mode==="session"?"selected":""}>🎲 Aleatoria por sesión</option>
            <option value="month" ${mode==="month"?"selected":""}>🗓️ Aleatoria mensual</option>
            <option value="quarter" ${mode==="quarter"?"selected":""}>📚 Aleatoria trimestral</option>
          </select>
        </div>
        <div class="field">
          <label>Estado de asistencia</label>
          <div class="rating-box" style="height:100%;padding:11px 13px"><b>${present.length} presentes</b><br><small style="color:var(--muted)">${absent.length} no han asistido y quedan fuera de la distribución.</small></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-soft" onclick="applyDistributionMode('${selected}')">✓ Aplicar distribución</button>
        <button class="btn btn-primary" onclick="randomizeSession('${selected}')">🔀 Aleatorizar esta sesión</button>
      </div>
      <p style="font-size:12px;color:var(--muted)">
        <b>Aleatoria por sesión</b> genera automáticamente una combinación nueva al entrar en una fecha/sesión nueva, y la conserva durante esa sesión.
        Puedes seguir arrastrando manualmente cualquier alumno entre sillones.
      </p>
      <div class="student-layout">${groupBoxes}</div>
    `}

    <div class="actions"><button class="btn btn-primary" onclick="save();closeModal();renderApp()">✓ Guardar cambios</button></div>
  `);
}

function academicCourseBounds(date){
  const d=parseDate(date), year=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;
  return {start:new Date(year,8,1),end:new Date(year+1,7,31,23,59,59),label:`${year}/${String(year+1).slice(-2)}`};
}
function trimesterBounds(date,n){
  const course=academicCourseBounds(date);
  if(n===1)return {start:new Date(course.start),end:new Date(course.start.getFullYear(),11,31,23,59,59)};
  if(n===2)return {start:new Date(course.start.getFullYear()+1,0,1),end:new Date(course.start.getFullYear()+1,2,31,23,59,59)};
  return {start:new Date(course.start.getFullYear()+1,3,1),end:new Date(course.start.getFullYear()+1,5,30,23,59,59)};
}
function statsPeriodLabel(period){return ({day:"Día",month:"Mes",trimester1:"1r trimestre",trimester2:"2º trimestre",trimester3:"3r trimestre",course:"Curso completo"}[period]||"Mes");}
function getStatsRange(period){
  const today=parseDate(currentDate);
  if(period==="day")return {start:new Date(today),end:new Date(today.getFullYear(),today.getMonth(),today.getDate(),23,59,59)};
  if(period==="month")return {start:new Date(today.getFullYear(),today.getMonth(),1),end:new Date(today.getFullYear(),today.getMonth()+1,0,23,59,59)};
  if(period==="course")return academicCourseBounds(currentDate);
  if(period==="trimester1"||period==="trimester2"||period==="trimester3")return trimesterBounds(currentDate,+period.slice(-1));
  return {start:new Date(today.getFullYear(),today.getMonth(),1),end:today};
}
function statsModal(){
 const all=state.students,period=window._statsPeriod||"month",range=getStatsRange(period);
 const rows=all.map(s=>{
   let scores=[],taskTotal=0,taskDone=0;
   Object.entries(state.evaluations).forEach(([k,e])=>{
     const date=k.split("|")[0],dd=parseDate(date);if(dd<range.start||dd>range.end||!e)return;
     const mid=activeModule(date)?.id;if(mid!==s.moduleId)return;
     const g=groupForStudent(s.moduleId,s.id,date);if(g<0)return;
     scores.push(((e.behavior||0)+(e.effectiveness||0))/2);
     state.tasks.filter(t=>taskAppliesToModule(t,mid)&&(taskAppliesToChair(t,g))).forEach(t=>{taskTotal++;if(e.tasks?.[t.id])taskDone++;});
   });
   return {s,score:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0,compliance:taskTotal?taskDone/taskTotal*100:0};
 });
 const rated=rows.filter(r=>r.score>0),avgScore=rated.length?rated.reduce((a,r)=>a+r.score,0)/rated.length:0,avgCompliance=rows.length?rows.reduce((a,r)=>a+r.compliance,0)/rows.length:0,course=academicCourseBounds(currentDate);
 return modalShell("📊 Estadísticas individuales",`

function saveChairs(){
  const oldCount=state.config.chairs;
  const count=Math.max(1,+document.getElementById("chairCount").value);
  const rows=Math.max(1,+document.getElementById("chairRows").value);
  const cols=Math.max(1,+document.getElementById("chairCols").value);
  const inputs=[...document.querySelectorAll(".chairLabelInput")];
  const labels=Array.from({length:count},(_,i)=>{const existing=inputs.find(x=>+x.dataset.index===i);return existing?+existing.value:(state.config.chairLabels[i]||i+1)});
  const valid=labels.every(n=>Number.isInteger(n)&&n>0)&&new Set(labels).size===labels.length;
  if(!valid)return showToast("Los números visibles deben ser enteros positivos y no repetirse");
  state.config.chairs=count;state.config.rows=rows;state.config.cols=cols;
  state.config.chairLabels=labels;
  const oldOrder=Array.isArray(state.config.chairOrder)?state.config.chairOrder:[];
  state.config.chairOrder=oldOrder.filter(i=>i<count);for(let i=0;i<count;i++)if(!state.config.chairOrder.includes(i))state.config.chairOrder.push(i);
  Object.keys(state.groups).forEach(mid=>{const g=state.groups[mid]||[];while(g.length<count)g.push([]);if(g.length>count){const removed=g.splice(count);const lost=removed.flat();if(lost.length)showToast("Aviso: hay alumnos en sillones eliminados");}state.groups[mid]=g;});
  Object.keys(state.sessionGroups||{}).forEach(key=>{const g=state.sessionGroups[key]||[];while(g.length<count)g.push([]);if(g.length>count){const removed=g.splice(count);const lost=removed.flat();if(lost.length)showToast("Aviso: había alumnos en sillones eliminados de una sesión");}state.sessionGroups[key]=g;});
  normalizeChairConfig();save();closeModal();renderApp();
}

function setStudentAttendance(sid,mid,present,date=currentDate){
  state.attendance[studentSessionKey(date,mid,sid)]=!!present;
  const key=sessionGroupKey(date,mid);
  const mode=distributionMode(mid);
  if(mode==="session"){
    distributeModule(mid,true,date);
  }else{
    state.sessionGroups[key]=cleanGroups(state.sessionGroups[key]||state.groups?.[mid]||[],mid,date);
    if(present){
      const assigned=new Set(state.sessionGroups[key].flat());
      if(!assigned.has(sid)){
        const idx=state.sessionGroups[key].reduce((best,g,i)=>g.length<state.sessionGroups[key][best].length?i:best,0);
        state.sessionGroups[key][idx].push(sid);
      }
    }
    const signature=sessionAttendanceSignature(mid,date);
    state.sessionMeta[key]={...(state.sessionMeta[key]||{}),attendanceSignature:signature,distributionMode:mode};
    saveSilent();
  }
  refreshModal("groups");
  renderApp();
}
function applyDistributionMode(mid){
  const mode=document.getElementById("distMode")?.value||"balanced";
  state.distributionRules[mid]={...(state.distributionRules[mid]||{}),mode};
  if(mode==="manual"){
    ensureSessionGroups(mid,currentDate);
  }else{
    distributeModule(mid,mode==="random"||mode==="session",currentDate);
  }
  save();showToast(`Distribución: ${mode==="manual"?"manual":mode==="session"?"aleatoria por sesión":mode==="random"?"aleatoria esta sesión":mode==="month"?"aleatoria mensual":mode==="quarter"?"aleatoria trimestral":"equitativa"}`);
  refreshModal("groups");
  renderApp();
}

function dropStudent(e,mid,idx){
  e.preventDefault();
  const sid=dragId||e.dataTransfer?.getData("text/plain");
  if(!sid)return;
  const key=sessionGroupKey(currentDate,mid);
  const groups=ensureSessionGroups(mid,currentDate).map(g=>g.filter(x=>x!==sid));
  while(groups.length<state.config.chairs)groups.push([]);
  if(isStudentPresent(currentDate,mid,sid))groups[idx].push(sid);
  state.sessionGroups[key]=groups;
  state.sessionMeta[key]={...(state.sessionMeta[key]||{}),distributionMode:"manual",attendanceSignature:sessionAttendanceSignature(mid,currentDate)};
  state.distributionRules[mid]={...(state.distributionRules[mid]||{}),mode:"manual"};
  dragId=null;save();refreshModal("groups");renderApp();
}
function parseCSVLine(line,delimiter=","){
  const out=[];let cur="",quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(quoted&&line[i+1]==='"'){cur+='"';i++;}else{quoted=!quoted;}
    }else if(ch===delimiter&&!quoted){out.push(cur);cur="";}else{cur+=ch;}
  }
  out.push(cur);return out;
}
function importStudents(ev,mid){
  const file=ev.target.files[0];if(!file)return;
  const isCsv=file.name.toLowerCase().endsWith(".csv");
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      let rows=[];
      if(isCsv){
        const csvText=String(e.target.result||"");
        const firstCsvLine=csvText.split(/\r?\n/).find(Boolean)||"";
        const delimiter=(firstCsvLine.includes(";")&&!firstCsvLine.includes(","))?";":",";
        rows=csvText.split(/\r?\n/).map(r=>parseCSVLine(r,delimiter)).filter(r=>r.some(c=>String(c||"").trim()));
      }else{
        if(!window.XLSX)throw Error("No se ha cargado el lector Excel");
        const wb=XLSX.read(e.target.result,{type:"array"});
        rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
      }
      if(!rows.length)throw Error("Archivo vacío");

      const first=rows[0]||[];
      const header=first.map(normalizeHeader);
      const fullNamePattern=/(nombre ?y ?apellidos|nombre completo|alumno|alumna|estudiante)/;
      const namePattern=/^nombre$|^nombres$|nombre$/;
      const surnamePattern=/apellido|apellidos/;
      const notesPattern=/observ|nota|comentario/;
      const fullCol=header.findIndex(h=>fullNamePattern.test(h));
      const nameCol=header.findIndex(h=>namePattern.test(h)&&!fullNamePattern.test(h));
      const surnameCol=header.findIndex(h=>surnamePattern.test(h));
      const notesCol=header.findIndex(h=>notesPattern.test(h));
      const hasHeader=fullCol>=0||nameCol>=0||surnameCol>=0||notesCol>=0;
      const startRow=hasHeader?1:0;

      const existing=new Set(studentsForModule(mid).map(s=>normalizeHeader(studentLabel(s))));
      const dataRows=rows.slice(startRow);
      const activeCols=new Set();
      dataRows.forEach(row=>row.forEach((cell,j)=>{if(String(cell??"").trim())activeCols.add(j);}));
      const singleNameColumn=!hasHeader&&activeCols.size===1;
      let added=0,skipped=0;

      for(let i=startRow;i<rows.length;i++){
        const row=rows[i]||[];
        let firstName="",surname="",notes="",full="";
        if(fullCol>=0){
          full=String(row[fullCol]??"").trim();
          ({firstName,surname}=splitStudentName(full));
        }else if(singleNameColumn){
          full=String(row[[...activeCols][0]]??"").trim();
          ({firstName,surname}=splitStudentName(full));
        }else{
          firstName=String(row[(nameCol>=0?nameCol:0)]??"").trim();
          surname=String(row[(surnameCol>=0?surnameCol:(nameCol>=0?1:1))]??"").trim();
        }
        notes=String(row[(notesCol>=0?notesCol:2)]??"").trim();
        if(!firstName&&!surname)continue;
        full=[firstName,surname].filter(Boolean).join(" ").trim();
        const norm=normalizeHeader(full);
        if(!norm){continue}
        if(existing.has(norm)){skipped++;continue}
        state.students.push({id:uid("s"),name:full,firstName,surname,moduleId:mid,notes});
        existing.add(norm);added++;
      }

      ensureSessionGroups(mid,currentDate);
      save();
      refreshModal("groups");
      showToast(`${added} alumno${added===1?"":"s"} importado${added===1?"":"s"}${skipped?`; ${skipped} duplicado${skipped===1?"":"s"} ignorado${skipped===1?"":"s"}`:""}`);
    }catch(err){
      console.error(err);showToast("No se pudo leer el archivo Excel/CSV");
    }
  };
  if(isCsv)reader.readAsText(file,"UTF-8");else reader.readAsArrayBuffer(file);
}
